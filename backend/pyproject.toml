[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "w3ex"
version = "0.1.0"
description = "Web3 Intelligence Exchange MVP — AI-native crypto market intelligence & execution terminal"
requires-python = ">=3.11"
license = { text = "Proprietary / Internal use only" }
authors = [{ name = "OrangeC" }]
keywords = ["web3", "crypto", "intelligence", "fastapi", "ai-agent", "onchain"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "aiosqlite>=0.20",
    "numpy>=1.26",
    "httpx>=0.27",
]

[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]
llm = ["openai>=1.40"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.4", "anyio>=4.0"]

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["w3ex", "w3ex.db", "w3ex.providers", "w3ex.providers.mock", "w3ex.core", "w3ex.intelligence", "w3ex.execution", "w3ex.api", "w3ex.api.routes"]

[project.scripts]
w3ex = "w3ex.cli:main"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "N"]
ignore = ["N818", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
